# QuietCart — static site, no build step.

[build]
  publish = "."
  command = ""

# HTML always revalidates, so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Images, CSS and JS are cached for a day. Filenames are not content-hashed,
# so keep this short enough that a swapped photo shows up quickly.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
