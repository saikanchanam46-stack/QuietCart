<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 296" width="520" height="296" role="img" aria-labelledby="pt pd">
<title id="pt">CalmCue cards</title><desc id="pd">Three cards on binder rings labelled breathe, feelings and quiet, each with a simple line drawing.</desc>
<defs>
  <pattern id="velcro" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#BEC8CB"/>
    <path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#AAB5B8" stroke-width="1.4"/>
  </pattern>
  <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse">
    <rect width="14" height="10" fill="#B7CFCC"/>
    <rect width="6" height="10" fill="#A5B8BD"/>
  </pattern>
  <pattern id="bumps" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#CCD7DA"/>
    <circle cx="5" cy="5" r="3.1" fill="#A9C6C1"/>
    <circle cx="14" cy="14" r="3.1" fill="#A9C6C1"/>
  </pattern>
  <pattern id="quilt" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="26" height="26" fill="none"/>
    <path d="M0 0h26M0 0v26" stroke="#9FB4BA" stroke-width="1.5" stroke-dasharray="4 4"/>
  </pattern>
  <linearGradient id="padlight" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#383E40" flood-opacity="0.16"/>
  </filter>
  <filter id="soft-sm" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#383E40" flood-opacity="0.14"/>
  </filter></defs>
<rect width="520" height="296" fill="#F2F5F5"/>
<g transform="rotate(-9 110 245)" filter="url(#soft-sm)"><rect x="46" y="58" width="128" height="176" rx="6" fill="#FDFEFE" stroke="#D8E0E2" stroke-width="1.6"/><g transform="translate(80.56,87.92) scale(0.5888)" fill="none" stroke="#2A6570" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="10"/><path d="M50 26a24 24 0 0 1 0 48" /><path d="M50 26a24 24 0 0 0 0 48"/><path d="M50 14v-2"/><path d="M50 88v2"/></g><text x="110.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#16292E" letter-spacing="0.2">Breathe</text><circle cx="110" cy="70" r="12" fill="none" stroke="#9AA0A2" stroke-width="4"/></g>
<g transform="rotate(0 242 245)" filter="url(#soft-sm)"><rect x="178" y="58" width="128" height="176" rx="6" fill="#FDFEFE" stroke="#D8E0E2" stroke-width="1.6"/><g transform="translate(212.56,87.92) scale(0.5888)" fill="none" stroke="#2A6570" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="28"/><path d="M40 44v4"/><path d="M60 44v4"/><path d="M38 60c4 6 20 6 24 0"/></g><text x="242.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#16292E" letter-spacing="0.2">Feelings</text><circle cx="242" cy="70" r="12" fill="none" stroke="#9AA0A2" stroke-width="4"/></g>
<g transform="rotate(9 374 245)" filter="url(#soft-sm)"><rect x="310" y="58" width="128" height="176" rx="6" fill="#FDFEFE" stroke="#D8E0E2" stroke-width="1.6"/><g transform="translate(344.56,87.92) scale(0.5888)" fill="none" stroke="#2A6570" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 56V48a24 24 0 0 1 48 0v8"/><path d="M26 54h8a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4z"/><path d="M74 54h-8a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4z"/></g><text x="374.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#16292E" letter-spacing="0.2">Quiet</text><circle cx="374" cy="70" r="12" fill="none" stroke="#9AA0A2" stroke-width="4"/></g>
</svg>
