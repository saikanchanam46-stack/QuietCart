<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="pt pd">
<title id="pt">The QuietCart attachment</title><desc id="pd">A padded board with a four-step visual shopping sequence along the top, CalmCue cards on a binder ring, a soft squeeze pad and two textured strips, with webbing straps and buckles running up behind the board.</desc>
<defs>
  <pattern id="velcro" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#BEC8CB"/>
    <path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#AAB5B8" stroke-width="1.4"/>
  </pattern>
  <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse">
    <rect width="14" height="10" fill="#B7CFCC"/>
    <rect width="6" height="10" fill="#A5B8BD"/>
  </pattern>
  <pattern id="bumps" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#CCD7DA"/>
    <circle cx="5" cy="5" r="3.1" fill="#A9C6C1"/>
    <circle cx="14" cy="14" r="3.1" fill="#A9C6C1"/>
  </pattern>
  <pattern id="quilt" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="26" height="26" fill="none"/>
    <path d="M0 0h26M0 0v26" stroke="#9FB4BA" stroke-width="1.5" stroke-dasharray="4 4"/>
  </pattern>
  <linearGradient id="padlight" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#383E40" flood-opacity="0.16"/>
  </filter>
  <filter id="soft-sm" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#383E40" flood-opacity="0.14"/>
  </filter></defs>
