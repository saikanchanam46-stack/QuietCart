<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 108 900 512" width="900" height="512" role="img" aria-labelledby="pt pd">
<title id="pt">The third QuietCart prototype on a workbench</title><desc id="pd">A padded prototype board with picture cards, a squeeze pad and textured strips laid on a cutting mat, surrounded by fabric swatches, a sketchbook, scissors and a pencil.</desc>
<defs>
  <pattern id="velcro" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#C2C7C4"/>
    <path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#ADB5B1" stroke-width="1.4"/>
  </pattern>
  <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse">
    <rect width="14" height="10" fill="#D5D8D6"/>
    <rect width="6" height="10" fill="#ADB5B1"/>
  </pattern>
  <pattern id="bumps" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#D1D5D3"/>
    <circle cx="5" cy="5" r="3.1" fill="#C4C9C6"/>
    <circle cx="14" cy="14" r="3.1" fill="#C4C9C6"/>
  </pattern>
  <pattern id="quilt" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="26" height="26" fill="none"/>
    <path d="M0 0h26M0 0v26" stroke="#A9B0AC" stroke-width="1.5" stroke-dasharray="4 4"/>
  </pattern>
  <linearGradient id="padlight" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#393F3C" flood-opacity="0.16"/>
  </filter>
  <filter id="soft-sm" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#393F3C" flood-opacity="0.14"/>
  </filter></defs>
