<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 296" width="520" height="296" role="img" aria-labelledby="pt pd">
<title id="pt">A visual shopping sequence</title><desc id="pd">Four picture cards on a velcro rail reading produce, dairy, checkout, home, joined by arrows.</desc>
<defs>
  <pattern id="velcro" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#CBC7BE"/>
    <path d="M0 8L8 0M-2 2L2 -2M6 10L10 6" stroke="#B8B4AA" stroke-width="1.4"/>
  </pattern>
  <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse">
    <rect width="14" height="10" fill="#B7CFCC"/>
    <rect width="6" height="10" fill="#BBB5A7"/>
  </pattern>
  <pattern id="bumps" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#D9D5CD"/>
    <circle cx="5" cy="5" r="3.1" fill="#A9C6C1"/>
    <circle cx="14" cy="14" r="3.1" fill="#A9C6C1"/>
  </pattern>
  <pattern id="quilt" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="26" height="26" fill="none"/>
    <path d="M0 0h26M0 0v26" stroke="#B7B1A2" stroke-width="1.5" stroke-dasharray="4 4"/>
  </pattern>
  <linearGradient id="padlight" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#403E38" flood-opacity="0.16"/>
  </filter>
  <filter id="soft-sm" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#403E38" flood-opacity="0.14"/>
  </filter></defs>
<rect width="520" height="296" fill="#F5F4F2"/>
<rect x="26" y="40" width="468" height="216" rx="14" fill="url(#velcro)" opacity="0.7"/>
<g filter="url(#soft-sm)"><rect x="46" y="62" width="92" height="172" rx="6" fill="#FEFEFD" stroke="#E1DFD9" stroke-width="1.6"/><g transform="translate(70.84,91.24000000000001) scale(0.4232)" fill="none" stroke="#4F6A55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 30c-9-9-26-8-30 6-5 17 8 40 16 46 6 5 10 2 14 2s8 3 14-2c8-6 21-29 16-46-4-14-21-15-30-6z"/><path d="M50 30V16"/><path d="M50 20c8-6 16-6 20-9-1 8-8 13-14 14"/></g><text x="92.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26332F" letter-spacing="0.2">Produce</text></g>
<g stroke="#AFACA4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M142 148h12"/><path d="M147 142.5l6 5.5-6 5.5"/></g>
<g filter="url(#soft-sm)"><rect x="158" y="62" width="92" height="172" rx="6" fill="#FEFEFD" stroke="#E1DFD9" stroke-width="1.6"/><g transform="translate(182.84,91.24000000000001) scale(0.4232)" fill="none" stroke="#4F6A55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 40h36v46a4 4 0 0 1-4 4H36a4 4 0 0 1-4-4z"/><path d="M32 40l18-16 18 16"/><path d="M41 24h18"/><path d="M41 58h18"/></g><text x="204.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26332F" letter-spacing="0.2">Dairy</text></g>
<g stroke="#AFACA4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M254 148h12"/><path d="M259 142.5l6 5.5-6 5.5"/></g>
<g filter="url(#soft-sm)"><rect x="270" y="62" width="92" height="172" rx="6" fill="#FEFEFD" stroke="#E1DFD9" stroke-width="1.6"/><g transform="translate(294.84,91.24000000000001) scale(0.4232)" fill="none" stroke="#4F6A55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 24h11l12 42h40"/><path d="M31 36h56l-8 24H39"/><circle cx="44" cy="80" r="6"/><circle cx="73" cy="80" r="6"/></g><text x="316.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26332F" letter-spacing="0.2">Checkout</text></g>
<g stroke="#AFACA4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M366 148h12"/><path d="M371 142.5l6 5.5-6 5.5"/></g>
<g filter="url(#soft-sm)"><rect x="382" y="62" width="92" height="172" rx="6" fill="#FEFEFD" stroke="#E1DFD9" stroke-width="1.6"/><g transform="translate(406.84,91.24000000000001) scale(0.4232)" fill="none" stroke="#4F6A55" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 50L50 24l30 26"/><path d="M28 46v40h44V46"/><path d="M42 86V64h16v22"/></g><text x="428.0" y="223" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26332F" letter-spacing="0.2">Home</text></g>
</svg>
