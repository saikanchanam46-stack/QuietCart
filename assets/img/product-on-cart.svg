<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 148 752 412" width="752" height="412" role="img" aria-labelledby="pt pd">
<title id="pt">QuietCart attached to an ordinary shopping cart</title><desc id="pd">A standard shopping cart seen from the side, with the QuietCart board strapped to the push handle so it faces the child seat. The cart itself is unchanged.</desc>
